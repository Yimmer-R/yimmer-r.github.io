<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b0d10">
<title>Yimmer</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-content: center;
    gap: 18px;
    padding: 24px;
    background: #0b0d10;
    color: #e8ecf1;
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
    text-align: center;
  }
  h1 { margin: 0; font-size: 20px; font-weight: 650; letter-spacing: -0.01em; }
  p { margin: 0; color: #8b97a8; font-size: 14px; }
  a {
    display: inline-block;
    margin-top: 6px;
    padding: 10px 18px;
    border-radius: 999px;
    background: #7dd3a0;
    color: #07130d;
    font-weight: 600;
    text-decoration: none;
    transition: transform 160ms cubic-bezier(0.23, 1, 0.32, 1);
  }
  a:active { transform: scale(0.97); }
</style>
</head>
<body>
  <h1>Calidad por hora</h1>
  <p>Mi biblioteca de juegos, ordenada por lo que rinde cada hora.</p>
  <a href="/biblioteca-juegos/">Abrir la app</a>
</body>
</html>
